name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm test:coverage

  # The workspace dependency matrix (.dependency-cruiser.cjs).
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm deps

  # Proves the purity lint and the dependency matrix still catch known violations.
  rails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm rails

  # Local Supabase from the migrations: reset, pgTAP, and the generated-types drift check.
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # Postgres, Auth (M2's RLS tests need auth.uid()), PostgREST, Kong and postgres-meta
      # (type generation). Nothing else is started.
      - name: Start Supabase
        run: >-
          pnpm exec supabase start --workdir packages/db
          -x realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor
      - run: pnpm db:reset
      - run: pnpm db:test
      # The worker's /readyz against a real Postgres. Here rather than in its own job, so CI
      # starts one Supabase stack, not two.
      - name: Worker readiness against Postgres
        run: pnpm --filter @faff/worker test:db
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Generated types match the migrations
        run: |
          pnpm db:types
          git diff --exit-code -- packages/db/src/types.gen.ts \
            || { echo "::error::types.gen.ts is stale. Run 'pnpm db:types' and commit it."; exit 1; }
      # Proves the drift check and pgTAP still fail on a table no migration created.
      - run: pnpm db:rails

  # The worker image: builds, boots, answers /healthz, runs as non-root, drains on SIGTERM.
  build-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f apps/worker/Dockerfile -t faff-worker .
      - run: apps/worker/scripts/smoke-image.sh faff-worker

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.18.4
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" detect --source . --redact --verbose'

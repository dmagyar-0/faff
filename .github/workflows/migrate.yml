# Applies packages/db/supabase/migrations to the hosted projects on merge to main (M0 plan §5,
# PR 0.2). faff-dev first, then faff-prod behind a required reviewer (M0-Q3): a migration is the
# one deploy that redeploying can't roll back.
#
# Dormant until the owner creates the projects (M0-Q4). Each job is skipped while its project
# ref is unset, so no GitHub environment is auto-created without protection. To enable:
#   1. Repo variables: SUPABASE_DEV_PROJECT_REF, SUPABASE_PROD_PROJECT_REF.
#   2. Repo secret: SUPABASE_ACCESS_TOKEN.
#   3. Environments `supabase-dev` and `supabase-prod`, each with secret SUPABASE_DB_PASSWORD and
#      deployment branches limited to `main`. `supabase-prod` gets a required reviewer.
#      Create them before setting the variables.

name: Migrate

on:
  push:
    branches: [main]
    paths:
      - packages/db/supabase/migrations/**
      - .github/workflows/migrate.yml
  workflow_dispatch:

permissions:
  contents: read

# Never run two pushes against the same database at once, and never cancel one mid-flight.
concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  dev:
    if: vars.SUPABASE_DEV_PROJECT_REF != ''
    runs-on: ubuntu-latest
    environment: supabase-dev
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_DEV_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Pending migrations
        run: pnpm exec supabase db push --workdir packages/db --project-ref "$PROJECT_REF" --dry-run
      - name: Push
        run: pnpm exec supabase db push --workdir packages/db --project-ref "$PROJECT_REF" --yes

  prod:
    needs: dev
    if: vars.SUPABASE_PROD_PROJECT_REF != ''
    runs-on: ubuntu-latest
    environment: supabase-prod
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROD_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Pending migrations
        run: pnpm exec supabase db push --workdir packages/db --project-ref "$PROJECT_REF" --dry-run
      - name: Push
        run: pnpm exec supabase db push --workdir packages/db --project-ref "$PROJECT_REF" --yes
